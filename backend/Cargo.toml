[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.5", features = ["cookie"] }
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.9", features = [ "runtime-tokio","sqlite","uuid","chrono"] }
dotenvy = "0.15"
serde = "*"
serde_json = "1"
reqwest = { version = "*", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
redis = { version = "1.6.0", features = ["tokio-comp", "aio"] }
[dependencies.uuid]
version = "1.22.0"
# Lets you generate random UUIDs
features = [
    "v4",
    "v7",
    "serde"
]
