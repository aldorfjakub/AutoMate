[package]
name = "orchestrator"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = {version = "1.53.1", features = ["full"]}
redis = { version = "1.6.0", features = ["tokio-comp", "aio"] }
sqlx = { version = "0.9", features = [ "runtime-tokio","sqlite","uuid","chrono"] }
serde = "*"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15.7"
shakmaty = "0.30.1"
rand = "0.10.2"


[dependencies.uuid]
version = "1.22.0"
features = [
    "v4",
    "v7",
    "serde"
]
